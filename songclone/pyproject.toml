[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "songclone"
version = "0.1.0"
description = "AI-powered song recreation system using REAPER DAW"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SongClone Team"}
]
dependencies = [
    # Agent orchestration
    "google-adk>=0.1.0",
    "google-genai>=0.1.0",

    # MCP
    "mcp>=0.1.0",

    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "sse-starlette>=1.8.0",

    # Data validation
    "pydantic>=2.5.0",

    # Audio analysis
    "demucs>=4.0.0",
    "basic-pitch>=0.3.0",
    "madmom>=0.16.1",
    "librosa>=0.10.0",

    # REAPER integration
    "python-reapy>=0.10.0",

    # Utilities
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "aiofiles>=23.2.0",
    "mido>=1.3.0",  # MIDI file parsing
    "python-dotenv>=1.0.0",

    # Observability
    "langfuse>=3.0.0",
    "openinference-instrumentation-google-adk>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
songclone = "songclone.api.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["songclone*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
